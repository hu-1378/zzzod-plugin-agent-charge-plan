#
# 为什么不直接加进主仓的 `compendium.yml`：
# 主仓已经有 `screen_name=快捷手册` 这个画面了，`screen_loader` 遇到重名会跳过后注册的那个，
# 插件覆盖不了。所以这里用全局唯一的 `快捷手册-特训目标` 单独注册一份区域定义，
