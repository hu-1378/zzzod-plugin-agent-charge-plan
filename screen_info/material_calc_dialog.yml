# 结果页一：图标横排。带数字的表示仍需获取（如 75 / 140），
# 没有数字、显示「已满足」的表示已达标。用于快速判断有没有缺口。
# 上边界收到 295 是为了避开明细表的表头行（255~290）——两个区域的 y 会重叠，
# 不收窄的话图标区会把表格的「所需/已有」数字当成缺口数字读进来。
- area_name: 区域-需要获取的材料
  id_mark: false
  pc_rect:
  - 460
  - 295
  - 1270
  - 480
  text: 需要获取的材料
  lcs_percent: 0.5
  template_sub_dir: ''
