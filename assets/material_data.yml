# 材料 → 体力副本入口 映射表
# 由 agent_charge_plan 插件的 planner / 「材料保持指定值」读取。
#
# 数据来源（按可靠性排序）
#   1. assets/game_data/compendium_data.yml —— 副本名 / mission_type / mission 名以它为准，
#      每个 charge_source 的三元组都能在这份表里查到。
#   2. BWIKI 材料筛选表（https://wiki.biligame.com/zzz/材料筛选）—— 材料名、类型、来源列。
#   3. BWIKI 单材料页「用途 / 描述」—— 认证章顶级专名的专长归属；高维数据与稀有残留物对应的 boss。
#   4. 截图 docs/screens/仓库-材料道具/、docs/screens/快捷手册/ —— DETAIL「[获取]」与电量档位。
#
# 字段约定
#   category     agent_promotion（认证章）/ agent_skill（芯片、高维数据）/ wengine（组件）/
#                basic（经验、镀剂、丁尼）/ expert_challenge（专业挑战室）/
#                weekly_boss（恶名狩猎）/ not_farmable（不消耗电量）
#   tier         同族 3 阶时 1/2/3，不适用为 null
#   charge_source  category_name / mission_type_name / mission_name 三元组，
#                  mission_name 为 null 表示副本表里该 category 只有 mission_type 层；
#                  charge_per_run 为单次消耗电量
#   amount_per_run 单次产出。公开资料没有稳定的「每次必掉 N 个」数值，全部留 null，
#                  不猜数字（planner 会按刷 1 次后重算兜底）。
#   farmable      false 表示不消耗电量、无法用体力刷，此时 charge_source 必须是 []
#
# charge_per_run 依据
#   实战模拟室 20   —— 特训目标截图显示「20-100」（单次 20，最多 5 次）
#   专业挑战室 40   —— 特训目标截图「提丰·重击者型」显示 40
#   恶名狩猎   60   —— 任务书口径；恶名狩猎每周前 3 次免电量（截图未直接覆盖）
#
# 顶级认证章专名 ↔ 专长（逐条查 BWIKI 单材料页「用途」确认）
#   先行者认证章 = 强攻 / 破阵者认证章 = 击破 / 掌控者认证章 = 异常 / 统御者认证章 = 支援 /
#   捍卫者认证章 = 防护 / 裁决者认证章 = 命破 / 执锋者认证章 = 锋御
#
# 已知未核实项
#   - 顶级/高阶/初阶认证章同属一个「X演练」，演练内按难度分档；难度与阶级的对应关系未在公开资料确认。
#   - 稀有残留物「浊纹晶质」对应 boss 按排除法推得（魇缚者·叶释渊）。

