# 覆盖主仓 agent.py / assets/game_data/agent/*.yml 里与游戏实际不一致的属性。
#
# 为什么需要这张表：本插件的硬约束是「不动主仓」，主仓数据有误也不能直接改。
# 这里只写需要纠正的角色，没写的仍按主仓数据走。
#
# 用途：「代理人技能」这个特训条目要按角色属性选具体副本（刚性测试=物理、电流测试=电属性……），
# 属性查错就会排错本。
#
# 数据来源：游戏内代理人界面的属性图标 + HoYoWiki / 百度百科。
#
# 注意：查表是「名字完全相等」才算命中，不做包含匹配，
# 所以「比利」的规则不会误伤「星辉比利」。
override_list:
  - agent_name: 比利
    element: 物理属性
    note: >-
      小比利（比利·奇德，A 级强攻）是物理属性，主仓 agent.py:233 和
      assets/game_data/agent/billy.yml 都标成了 ELECTRIC。
  - agent_name: 星辉比利
    element: 物理属性
    note: >-
      大比利（星辉比利，S 级强攻）主仓标的是 PHYSICAL，本来就对；
      这里显式写一条，防止以后主仓改动时又错回去。